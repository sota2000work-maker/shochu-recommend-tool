<html lang="ja">

<style>
  /* 変数名はウイスキー版のものを流用している（将来の統合時に差分を小さくするため）。色は藍色系 */
  :root {
    --whisky: #2c4a6e;
    --whisky-dark: #1c3150;
    --amber: #6f93bb;
    --amber-soft: #dde7f2;
    --cream: #f5f7fa;
    --paper: #ffffff;
    --ink: #1f2933;
    --ink-soft: #5f6b78;
    --border: #d9e1ea;

  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    max-width: 900px; margin: 0 auto; padding: 14px 12px 32px;
    background: var(--cream); color: var(--ink); line-height: 1.5;

  h1, h2, h3 { font-family: "Hiragino Mincho ProN", Georgia, serif; font-weight: 600; letter-spacing: .02em; }

  fieldset { margin-bottom: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--paper); }
  legend { font-weight: 600; padding: 0 8px; color: var(--whisky); font-size: 14px; }
  label { display: inline-block; margin: 6px 10px 6px 0; padding: 4px 2px; }
  label input[type="checkbox"] { width: 18px; height: 18px; vertical-align: middle; margin-right: 4px; accent-color: var(--whisky); }
  input[type="text"], input[type="password"] {
    font-size: 16px; padding: 9px 10px; width: 100%; margin: 4px 0 8px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--paper); color: var(--ink);
  }
  input:focus { outline: 2px solid var(--amber-soft); border-color: var(--amber); }
  button { font-size: 16px; padding: 12px 20px; margin-top: 4px; border-radius: 10px; cursor: pointer; transition: transform .05s ease, opacity .15s ease; }
  button:active { transform: scale(0.98); }
  button.primary { width: 100%; background: var(--whisky); color: #fff; border: none; box-shadow: 0 2px 6px rgba(44,74,110,0.25); }
  button.secondary { background: var(--paper); border: 1px solid var(--whisky); color: var(--whisky); }
  .tabBar { display: flex; gap: 6px; margin-bottom: 14px; position: sticky; top: 0; background: var(--cream); padding: 10px 0 6px; z-index: 5; }
  .tabBtn { flex: 1; padding: 10px 4px; font-size: 13px; border: 1px solid var(--border); background: var(--paper); color: var(--ink-soft); border-radius: 999px; font-weight: 600; transition: all .15s ease; }
  .tabBtn.active { background: var(--whisky); color: #fff; border-color: var(--whisky); box-shadow: 0 2px 6px rgba(44,74,110,0.25); }
  .tabPanel { display: none; }
  .tabPanel.active { display: block; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
  .card {
    border: 1px solid var(--border); border-left: 4px solid var(--amber);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; background: var(--paper);
    box-shadow: 0 1px 3px rgba(43,36,32,0.06), 0 1px 2px rgba(43,36,32,0.04);
  }
  .card h3 { margin: 0 0 6px 0; font-size: 16px; display: flex; align-items: center; gap: 6px; }
  .score {
    font-weight: 700; color: var(--whisky-dark); font-size: 12px; background: var(--amber-soft);
    padding: 2px 9px; border-radius: 999px; white-space: nowrap; margin-left: auto;
  }
  .meta { color: var(--ink-soft); font-size: 13px; }
  .thumb { float: right; width: 72px; height: 96px; object-fit: contain; margin: 0 0 6px 10px; background: #fff; border-radius: 8px; }
  .tag {
    display: inline-block; background: var(--cream); border: 1px solid var(--border); color: var(--ink);
    border-radius: 999px; padding: 3px 10px; margin: 2px 4px 2px 0; font-size: 12px; cursor: pointer;
  }
  .tag.glossary { border-color: var(--amber); }
  .highlight {
    margin: 8px 0; font-size: 14px; color: var(--whisky-dark); background: var(--amber-soft);
    padding: 8px 10px; border-radius: 8px; border-left: 3px solid var(--amber);
  }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--ink-soft); letter-spacing: .02em; }

  .muted { color: var(--ink-soft); font-size: 13px; }
  .syncBar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }

  .overlay.hidden { display: none; }

  @media (max-width: 480px) {

  }

<script>
// 酒部門/焼酎/scoring.js
// 選択肢の定義とマッチングロジック（純粋関数）。
// build.js でこのファイルの中身がそのまま index.html に埋め込まれるため、
// ブラウザ・Node.js のどちらでも動く形（ファイル末尾のエクスポート文のみ Node 依存）にしてある。

const PRICE_BANDS = [
  { id: 'under1000', label: '〜1,000円', min: 0, max: 1000 },
  { id: '1000to1500', label: '1,000〜1,500円', min: 1000, max: 1500 },
  { id: '1500to2000', label: '1,500〜2,000円', min: 1500, max: 2000 },
  { id: 'over2000', label: '2,000円〜', min: 2000, max: Infinity },
];

const MATERIALS = ['芋', '麦', '米', '黒糖', 'その他'];

const FLAVOR_TAGS = ['すっきり・軽快', '華やか・フルーティー', '甘い香り', 'コク・濃厚', '香ばしい', '熟成・樽香'];

const SERVING_STYLE_TAGS = ['ロック', '水割り', 'お湯割り', 'ソーダ割り', 'ストレート'];

function priceBandsForProduct(price) {
  if (price === null || price === undefined) return [];
  return PRICE_BANDS.filter((b) => price >= b.min && price < b.max).map((b) => b.id);
}

function scoreProduct(product, criteria) {
  let totalCriteria = 0;
  let matchedCount = 0;
  const breakdown = {};

  if (criteria.priceBandIds && criteria.priceBandIds.length > 0) {
    // 価格条件が指定されている場合は常にtotalCriteriaに数える。価格不明の商品は「不一致」として扱う
    // （ウイスキー版で、価格不明を除外していたため不当に高スコアになっていた問題の修正をそのまま引き継いでいる）。
    totalCriteria++;
    if (product.price !== null && product.price !== undefined) {
      const matched = priceBandsForProduct(product.price).some((id) => criteria.priceBandIds.includes(id));
      if (matched) matchedCount++;
      breakdown.price = matched;
    } else {
      breakdown.price = null; // 表示側で「価格不明」と「価格条件外」を区別できるようnullのまま
    }
  }

  if (criteria.materials && criteria.materials.length > 0) {
    totalCriteria++;
    const matched = product.material != null && criteria.materials.includes(product.material);
    if (matched) matchedCount++;
    breakdown.material = matched;
  }

  if (criteria.flavors && criteria.flavors.length > 0) {
    totalCriteria++;
    const matched = (product.flavors || []).some((f) => criteria.flavors.includes(f));
    if (matched) matchedCount++;
    breakdown.flavors = matched;
  }

  if (criteria.servingStyles && criteria.servingStyles.length > 0) {
    totalCriteria++;
    const matched = (product.servingStyles || []).some((s) => criteria.servingStyles.includes(s));
    if (matched) matchedCount++;
    breakdown.servingStyles = matched;
  }

  const score = totalCriteria === 0 ? 0 : matchedCount / totalCriteria;
  return { score, matchedCount, totalCriteria, breakdown };
}

// 商品名・原料の詳細・産地（県）・麹を対象にした部分一致検索（一覧タブ・レコメンドタブ共通）
function matchesFreeText(product, text) {
  if (!text) return true;
  return [product.name, product.materialDetail, product.prefecture, product.koji]
    .filter(Boolean).some((v) => v.includes(text));
}

// 条件が1つも指定されていない場合、全商品がスコア0で同着になり実質無作為順になってしまうため、
// UI層に頼らずロジック層でも空配列を返すようにする（呼び出し元がUIのガードを経由しない場合の安全策）。
function hasAnyCriteria(criteria) {
  return !!(
    (criteria.freeText && criteria.freeText.trim())
    || (criteria.priceBandIds && criteria.priceBandIds.length)
    || (criteria.materials && criteria.materials.length)
    || (criteria.flavors && criteria.flavors.length)
    || (criteria.servingStyles && criteria.servingStyles.length)
  );
}

function rankProducts(products, criteria, topN) {
  if (!hasAnyCriteria(criteria)) return [];
  const active = products.filter((p) => p.status !== 'discontinued' && matchesFreeText(p, criteria.freeText));
  const scored = active.map((p) => ({ product: p, ...scoreProduct(p, criteria) }));
  scored.sort((a, b) => b.score - a.score || b.matchedCount - a.matchedCount);
  return scored.slice(0, topN);
}


</script>

  '芋': 'さつま芋を主原料にした焼酎。鹿児島県・宮崎県が主な産地です。芋の品種（黄金千貫・紅はるか・紫芋など）や麹の違いで、甘い香りのものからすっきりしたものまで幅があります。お湯割りにすると香りが立ちます。',

  '黒糖': '黒糖と米麹で造る焼酎で、鹿児島県の奄美群島でのみ製造が認められています。ほのかに甘い香りと、まろやかな口当たりが特徴です。',

let PRODUCTS = [];
// 管理パスコードで認証できた場合にのみ入る、取扱終了品の配列（PRODUCTSには混ぜない）
let ADMIN_DISCONTINUED = [];

function loadCache() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return parsed.products || null;
  } catch (e) {
    return null;
  }
}

function saveCache(products) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ products, syncedAt: Date.now() }));
  } catch (e) {
    // 保存できなくても動作は継続する
  }
}

function getLastSyncedAt() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw).syncedAt || null;
  } catch (e) {
    return null;
  }
}

function formatSyncedAt(ts) {
  if (!ts) return '未同期';
  const d = new Date(ts);
  return '最終同期: ' + d.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function updateSyncStatus() {
  document.getElementById('syncStatus').textContent = formatSyncedAt(getLastSyncedAt());
}

// スタッフパスコードを添えてApps Scriptから最新データを取得する。
// adminPasscodeを渡すと、それが管理パスコードと一致した場合のみ取扱終了品(ADMIN_DISCONTINUED)も取得する。
// 戻り値: { ok, reason } reasonは 'network'（通信不可）/ 'invalid'（スタッフパスコード誤り）/
//        'admin_invalid'（管理パスコード誤り）/ 'not_configured'
async function syncFromServer(passcode, silent, adminPasscode) {
  if (!APPS_SCRIPT_URL) {
    return { ok: false, reason: 'not_configured' };
  }
  try {
    const body = { action: 'sync', passcode };
    if (adminPasscode) body.adminPasscode = adminPasscode;
    const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) });
    const data = await res.json();
    if (data.error === 'passcode_invalid') {
      return { ok: false, reason: 'invalid' };
    }
    if (!data.products) throw new Error('invalid_response');
    PRODUCTS = data.products;
    saveCache(PRODUCTS);
    updateSyncStatus();
    renderListResults();
    if (adminPasscode) {
      if (!data.discontinuedProducts) {
        return { ok: false, reason: 'admin_invalid' };
      }
      ADMIN_DISCONTINUED = data.discontinuedProducts;
    }
    populateAdminLists();
    return { ok: true };
  } catch (e) {
    if (!silent) alert('同期に失敗しました。通信環境をご確認ください。');
    return { ok: false, reason: 'network' };
  }
}

document.getElementById('syncButton').addEventListener('click', async () => {
  const passcode = localStorage.getItem(STAFF_PASSCODE_KEY) || '';
  await syncFromServer(passcode, false);
});

document.getElementById('logoutButton').addEventListener('click', () => {
  if (!confirm('ログアウトしますか？この端末に保存されているパスコードを消去します。')) return;
  localStorage.removeItem(STAFF_PASSCODE_KEY);
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
});

// ---------- 起動時認証ゲート ----------

function showAuthError(text) {
  document.getElementById('authMsg').innerHTML = `<div class="msg err">${text}</div>`;
}

function enterApp() {
  document.getElementById('authGate').classList.add('hidden');
  document.getElementById('appRoot').style.display = 'block';
  startApp();
}

async function tryStaffLogin(passcode, silent) {
  if (!APPS_SCRIPT_URL) {
    // Apps Script未設定時の開発確認用フォールバック（非機密のプレースホルダーデータのみ使用）
    PRODUCTS = loadCache() || SEED_PRODUCTS;
    localStorage.setItem(STAFF_PASSCODE_KEY, passcode);
    return true;
  }
  const result = await syncFromServer(passcode, true);
  if (result.ok) {
    localStorage.setItem(STAFF_PASSCODE_KEY, passcode);
    return true;
  }
  if (result.reason === 'network') {
    // オフライン時は、直近まで認証済みだった端末ならキャッシュで継続動作させる
    const cached = loadCache();
    if (cached && localStorage.getItem(STAFF_PASSCODE_KEY)) {
      PRODUCTS = cached;
      return true;
    }
    if (!silent) showAuthError('通信環境をご確認ください（初回はオンラインでの認証が必要です）。');
    return false;
  }
  if (!silent) showAuthError('パスコードが正しくありません。');
  localStorage.removeItem(STAFF_PASSCODE_KEY);
  return false;
}

document.getElementById('authButton').addEventListener('click', async () => {
  const passcode = document.getElementById('authPasscode').value;
  if (!passcode) { showAuthError('パスコードを入力してください'); return; }
  const ok = await tryStaffLogin(passcode, false);
  if (ok) enterApp();
});

async function initAuth() {
  const storedPasscode = localStorage.getItem(STAFF_PASSCODE_KEY);
  if (storedPasscode) {
    const ok = await tryStaffLogin(storedPasscode, true);
    if (ok) { enterApp(); return; }
  }
  // ゲート画面のまま入力待ち
}

// ---------- 用語集ポップアップ ----------

function openGlossary(term) {
  const def = FLAVOR_GLOSSARY[term] || MATERIAL_GLOSSARY[term];
  if (!def) return;
  document.getElementById('glossaryContent').innerHTML = `<h2>${escapeHtml(term)}</h2><p>${def}</p>`;
  document.getElementById('glossaryOverlay').classList.remove('hidden');
}

document.getElementById('glossaryCloseButton').addEventListener('click', () => {
  document.getElementById('glossaryOverlay').classList.add('hidden');
});

function glossaryTagHtml(term, extraClass) {
  const hasGlossary = FLAVOR_GLOSSARY[term] || MATERIAL_GLOSSARY[term];
  const cls = 'tag' + (hasGlossary ? ' glossary' : '') + (extraClass ? ' ' + extraClass : '');
  const safeTerm = escapeHtml(term);
  return `<span class="${cls}" data-term="${safeTerm}">${safeTerm}${hasGlossary ? ' ⓘ' : ''}</span>`;
}

// タグクリックで用語集を開く（イベント委譲。結果カード・フォーム双方に対応）
document.body.addEventListener('click', (e) => {
  const tagEl = e.target.closest('.tag.glossary');
  if (tagEl) {
    openGlossary(tagEl.getAttribute('data-term'));
  }
});

// ---------- レコメンドタブ ----------

function renderCheckboxGroup(containerId, name, values, withGlossary) {
  const container = document.getElementById(containerId);
  container.innerHTML = values.map((v) => {
    const info = withGlossary && (FLAVOR_GLOSSARY[v] || MATERIAL_GLOSSARY[v])
      ? ` <span class="tag glossary" data-term="${v}" style="padding:1px 6px;">ⓘ</span>` : '';
    return `<label><input type="checkbox" name="${name}" value="${v}">${v}${info}</label>`;
  }).join('');
}

function initForm() {
  renderCheckboxGroup('priceFields', 'price', PRICE_BANDS.map((b) => b.label));
  renderCheckboxGroup('materialFields', 'material', MATERIALS, true);
  renderCheckboxGroup('flavorFields', 'flavor', FLAVOR_TAGS, true);
  renderCheckboxGroup('servingStyleFields', 'servingStyle', SERVING_STYLE_TAGS);
}

function getCheckedValues(name) {
  return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map((el) => el.value);
}

function priceLabelsToBandIds(labels) {
  return PRICE_BANDS.filter((b) => labels.includes(b.label)).map((b) => b.id);
}

// スプレッドシート由来の文字列をHTMLに埋め込む前にエスケープする（XSS対策）。
// 数値（price等）はエスケープ不要。
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 例: 1,280円（720ml） ／ 芋（さつま芋（黄金千貫）・米麹） ／ 鹿児島県 ／ 黒麹 ／ 25度
// 値がない項目は省く
function metaLineHtml(p) {
  const price = p.price === null || p.price === undefined ? '価格不明' : p.price.toLocaleString() + '円';
  const parts = [price + (p.spec ? '（' + escapeHtml(p.spec) + '）' : '')];
  if (p.material) parts.push(escapeHtml(p.material) + (p.materialDetail ? '（' + escapeHtml(p.materialDetail) + '）' : ''));
  if (p.prefecture) parts.push(escapeHtml(p.prefecture));
  if (p.koji) parts.push(escapeHtml(p.koji));
  if (typeof p.abv === 'number') parts.push(p.abv + '度');
  return `<div class="meta">${parts.join(' ／ ')}</div>`;
}

// 画像はアプリと同じ場所の img/ に置いたファイルを使う（外部サイトには接続しない）。
// スプレッドシートの imageUrl 列には "img/xxxxxxxxxxxxxxxx.webp" の形式で入れる。読み込み失敗時は画像を消す。
function thumbHtml(p) {
  if (typeof p.imageUrl !== 'string' || !/^img\/[0-9a-f]{16}\.webp$/.test(p.imageUrl)) return '';
  return `<img class="thumb" src="${p.imageUrl}" alt="" loading="lazy" onerror="this.remove()">`;
}

// 確証度が high 以外（未設定含む）なら警告する
function confidenceCaution(p) {
  const lowConfidence = p.attributeConfidence !== 'high' || p.highlightConfidence !== 'high';
  return lowConfidence
    ? `<div class="caution">⚠ 情報の確証度が低めです。商品コード <span class="code">${escapeHtml(p.code)}</span> で現物のラベルをご確認ください</div>`
    : '';
}

function renderResultCard(entry) {
  const p = entry.product;
  // フリーワードだけで検索した場合は一致度を計算する条件がなく、全件「0%」と出て誤解を招くため表示しない
  const scoreBadge = entry.totalCriteria > 0 ? `<span class="score">一致度 ${Math.round(entry.score * 100)}%</span>` : '';
  const highlight = p.highlight ? `<div class="highlight">${escapeHtml(p.highlight)}</div>` : '';
  return `
    <div class="card">
      ${thumbHtml(p)}
      <h3>${escapeHtml(p.name)}${scoreBadge}</h3>
      ${metaLineHtml(p)}
      <div>${(p.flavors || []).map((f) => glossaryTagHtml(f)).join('')}</div>
      <div>${(p.servingStyles || []).map((s) => glossaryTagHtml(s)).join('')}</div>
      ${highlight}
      ${confidenceCaution(p)}
      <div class="code" style="margin-top:6px;">コード: ${escapeHtml(p.code)}</div>
    </div>
  `;
}

document.getElementById('searchButton').addEventListener('click', () => {
  const criteria = {
    freeText: document.getElementById('recommendFreeText').value.trim(),
    priceBandIds: priceLabelsToBandIds(getCheckedValues('price')),
    materials: getCheckedValues('material'),
    flavors: getCheckedValues('flavor'),
    servingStyles: getCheckedValues('servingStyle'),
  };
  if (!hasAnyCriteria(criteria)) {
    document.getElementById('results').innerHTML = '<p class="muted">絞り込み条件を1つ以上選んでください。</p>';
    return;
  }
  const ranked = rankProducts(PRODUCTS, criteria, 20);
  document.getElementById('results').innerHTML = ranked.length > 0
    ? ranked.map(renderResultCard).join('')
    : '<p class="muted">条件に合う商品が見つかりませんでした。条件を減らしてお試しください。</p>';
});

document.getElementById('clearCriteriaButton').addEventListener('click', () => {
  document.getElementById('criteriaForm').querySelectorAll('input[type="checkbox"]').forEach((el) => { el.checked = false; });
  document.getElementById('recommendFreeText').value = '';
  document.getElementById('results').innerHTML = '';
});

// ---------- 一覧タブ ----------

function renderListCard(p) {
  return `
    <div class="card" data-code="${escapeHtml(p.code)}">
      ${thumbHtml(p)}
      <h3>${escapeHtml(p.name)}</h3>
      ${metaLineHtml(p)}
      <div>${(p.flavors || []).map((f) => `<span class="tag">${escapeHtml(f)}</span>`).join('')}</div>
      <div class="code" style="margin-top:6px;">コード: ${escapeHtml(p.code)}</div>
    </div>
  `;
}

function renderListResults() {
  const q = (document.getElementById('listSearch').value || '').trim();
  const active = PRODUCTS.filter((p) => p.status !== 'discontinued');
  const filtered = active.filter((p) => matchesFreeText(p, q));
  const container = document.getElementById('listResults');
  container.innerHTML = filtered.map(renderListCard).join('');
  container.querySelectorAll('.card').forEach((card) => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.tag')) return; // タグクリックは用語集を優先
      openDetail(card.getAttribute('data-code'));
    });
  });
}

document.getElementById('listSearch').addEventListener('input', renderListResults);

// ---------- 詳細オーバーレイ ----------

function openDetail(code) {
  const p = PRODUCTS.find((x) => x.code === code);
  if (!p) return;
  document.getElementById('detailContent').innerHTML = `
    ${thumbHtml(p)}
    <h2>${escapeHtml(p.name)}</h2>
    ${metaLineHtml(p)}
    <div>${(p.flavors || []).map((f) => glossaryTagHtml(f)).join('')}</div>
    <div>${(p.servingStyles || []).map((s) => glossaryTagHtml(s)).join('')}</div>
    ${p.highlight ? `<div class="highlight">${escapeHtml(p.highlight)}</div>` : ''}
    ${p.status === 'discontinued' ? '<div class="caution">現在は取扱終了商品です</div>' : ''}
    ${confidenceCaution(p)}
    <div class="code" style="margin-top:8px;">商品コード: ${escapeHtml(p.code)}</div>
  `;
  document.getElementById('detailOverlay').classList.remove('hidden');
}

document.getElementById('detailCloseButton').addEventListener('click', () => {
  document.getElementById('detailOverlay').classList.add('hidden');
});

// ---------- 管理タブ（取り扱い終了・再開のみ） ----------

let adminPasscodeValue = '';

document.getElementById('adminUnlockButton').addEventListener('click', async () => {
  const value = document.getElementById('adminPasscode').value;
  if (!value) {
    alert('パスコードを入力してください');
    return;
  }
  const staffPasscode = localStorage.getItem(STAFF_PASSCODE_KEY) || '';
  const result = await syncFromServer(staffPasscode, true, value);
  if (!result.ok) {
    alert('パスコードが正しくありません。');
    return;
  }
  adminPasscodeValue = value;
  document.getElementById('adminBody').style.display = 'block';
});

function populateAdminLists() {
  const active = PRODUCTS; // サーバー側で既に取扱中のみに絞り込まれている
  const discontinued = ADMIN_DISCONTINUED; // 管理パスコードで認証済みの場合のみ入っている

  document.getElementById('admActiveList').innerHTML = active.map((p) => `
    <div class="adminListRow">
      <span class="name">${escapeHtml(p.name)}</span>
      <button type="button" class="secondary admDiscontinueBtn" data-code="${escapeHtml(p.code)}">取り扱い終了</button>
    </div>
  `).join('') || '<p class="muted">対象商品がありません</p>';

  document.getElementById('admDiscontinuedList').innerHTML = discontinued.map((p) => `
    <div class="adminListRow">
      <span class="name">${escapeHtml(p.name)}</span>
      <button type="button" class="secondary admReactivateBtn" data-code="${escapeHtml(p.code)}">再開する</button>
    </div>
  `).join('') || '<p class="muted">取り扱い終了中の商品はありません</p>';

  document.querySelectorAll('.admDiscontinueBtn').forEach((btn) => {
    btn.addEventListener('click', () => setStatus(btn.getAttribute('data-code'), 'discontinued'));
  });
  document.querySelectorAll('.admReactivateBtn').forEach((btn) => {
    btn.addEventListener('click', () => setStatus(btn.getAttribute('data-code'), 'active'));
  });
}

function showAdminMsg(text, ok) {
  const el = document.getElementById('adminMsg');
  el.innerHTML = `<div class="msg ${ok ? 'ok' : 'err'}">${text}</div>`;
}

async function callAppsScript(payload) {
  if (!APPS_SCRIPT_URL) {
    showAdminMsg('Apps ScriptのURLが未設定です。READMEを参照して設定してください。', false);
    return false;
  }
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ ...payload, passcode: adminPasscodeValue }),
    });
    const data = await res.json();
    if (data.error === 'passcode_invalid') {
      showAdminMsg('パスコードが正しくありません。', false);
      return false;
    }
    if (data.error) {
      showAdminMsg('エラーが発生しました: ' + data.error, false);
      return false;
    }
    const staffPasscode = localStorage.getItem(STAFF_PASSCODE_KEY) || '';
    await syncFromServer(staffPasscode, true, adminPasscodeValue || null);
    return true;
  } catch (e) {
    showAdminMsg('通信エラーが発生しました。通信環境をご確認ください。', false);
    return false;
  }
}

async function setStatus(code, status) {
  const success = await callAppsScript({ action: 'setStatus', code, status });
  if (success) showAdminMsg(status === 'discontinued' ? '取り扱い終了にしました' : '取り扱いを再開しました', true);
}

// ---------- タブ切り替え ----------

document.querySelectorAll('.tabBtn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabBtn').forEach((b) => b.classList.remove('active'));
    document.querySelectorAll('.tabPanel').forEach((p) => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.getAttribute('data-tab')).classList.add('active');
  });
});

// ---------- アプリ本体の初期化（認証成功後に実行） ----------

function startApp() {
  initForm();
  renderListResults();
  updateSyncStatus();
  populateAdminLists();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

initAuth();
</script>
